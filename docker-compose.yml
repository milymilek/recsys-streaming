x-spark-common: &spark-common
  build:
    context: services/recsys-lakehouse
    dockerfile: Dockerfile
  environment:
    - SPARK_SUBMIT_ARGS=--packages io.delta:delta-core_2.12:2.4.0
  volumes:
    - ./services/recsys-lakehouse/.datalake:/opt/bitnami/spark/.datalake
    - ./services/recsys-lakehouse/recsys_lakehouse:/opt/bitnami/spark/recsys_lakehouse
  networks:
    - recsys-streaming-net

x-airflow-common: &airflow-common
  build:
    context: services/recsys-orchestration
    dockerfile: Dockerfile
  env_file:
    - services/recsys-orchestration/airflow.env
  volumes:
    - ./services/recsys-orchestration/dags:/opt/airflow/dags
    - ./services/recsys-orchestration/jobs:/opt/airflow/jobs
    - ./services/recsys-orchestration/logs:/opt/airflow/logs
    - ./services/recsys-lakehouse/recsys_lakehouse:/opt/airflow/recsys_lakehouse
    - ./services/recsys-lakehouse/.datalake:/opt/airflow/.datalake
  depends_on:
    - postgres
  networks:
    - recsys-streaming-net

services:
  spark-master:
    <<: *spark-common
    command: bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "9090:8080"
      - "7077:7077"

  spark-worker:
    <<: *spark-common
    command: bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_WORKER_CORES: 6
      SPARK_WORKER_MEMORY: 12g
      SPARK_MASTER_URL: spark://spark-master:7077

  postgres:
    image: postgres:14.0
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    networks:
      - recsys-streaming-net

  webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - scheduler

  scheduler:
    <<: *airflow-common
    command: bash -c "airflow db migrate && airflow users create --username admin --firstname Recsys --lastname Streaming --role Admin --email recsys@streaming.com --password admin && airflow scheduler"

  superset:
    image: apache/superset:latest
    container_name: superset
    depends_on:
      - postgres
    environment:
      - SUPERSET_CONFIG_PATH=/opt/superset/superset_config.py
      - POSTGRES_USER="airflow"
      - POSTGRES_PASSWORD="airflow"
      - POSTGRES_DB="airflow"
      - POSTGRES_HOST="postgres"
    volumes:
      - ./superset:/opt/superset
    ports:
      - "8088:8088"
    networks:
      - recsys-streaming-net
    command: /bin/bash -c "pip install psycopg2-binary && superset db upgrade && superset fab create-admin --username admin --firstname Admin --lastname Admin --email admin@admin.com --password admin && superset init && superset run -h 0.0.0.0 -p 8088"

networks:
  recsys-streaming-net: