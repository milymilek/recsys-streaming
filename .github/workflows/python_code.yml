name: Python Code CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Setup env and run tests
      working-directory: ./recsys-streaming-ml
      run: |
        pip install poetry
        poetry install
        poetry run pytest
